<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Coach Financeiro</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="theme-color" content="#2F6B4F">
<style>
  :root{
    --bg:#F2F5EF;
    --surface:#FFFFFF;
    --ink:#1F2B24;
    --ink-soft:#5C6B60;
    --border:#DCE3D8;
    --pos:#2F6B4F;
    --pos-soft:#E4EFE8;
    --neg:#A6432F;
    --neg-soft:#F3E4DF;
    --warn:#B9822F;
    --warn-soft:#F5EBD8;
    --inv:#2F5D6B;
    --inv-soft:#E1EBEF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:Georgia,'Iowan Old Style',serif;
    font-weight:600;
    margin:0;
  }
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);}

  header.top{
    padding:calc(env(safe-area-inset-top) + 18px) 18px 14px;
    border-bottom:1px solid var(--border);
  }
  header.top h1{font-size:22px;letter-spacing:.2px;}
  header.top p{margin:4px 0 0;color:var(--ink-soft);font-size:13px;}

  nav.tabs{
    display:flex;
    overflow-x:auto;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    position:sticky;top:0;z-index:5;
  }
  nav.tabs button{
    flex:1 0 auto;
    padding:13px 14px;
    border:none;
    background:none;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--pos);font-weight:600;}

  main{padding:16px 16px calc(env(safe-area-inset-bottom) + 40px);}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }
  .balance-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .balance-num{font-family:Georgia,serif;font-size:30px;font-variant-numeric:tabular-nums;}
  .balance-num.neg{color:var(--neg);}
  .balance-num.pos{color:var(--pos);}
  .balance-label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}
  .mini-row{display:flex;gap:10px;}
  .mini{flex:1;border-top:1px solid var(--border);padding-top:8px;}
  .mini .n{font-size:16px;font-variant-numeric:tabular-nums;}
  .mini .l{font-size:11.5px;color:var(--ink-soft);}

  .section-title{font-size:13px;color:var(--ink-soft);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px;}

  .bar-row{margin-bottom:10px;}
  .bar-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px;}
  .bar-track{height:7px;background:var(--pos-soft);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--pos);}
  .bar-fill.over{background:var(--neg);}

  .alert{
    display:flex;gap:10px;
    padding:11px 12px;border-radius:8px;margin-bottom:8px;
    font-size:13.5px;line-height:1.4;
  }
  .alert.warn{background:var(--warn-soft);color:#6B4D18;}
  .alert.neg{background:var(--neg-soft);color:var(--neg);}
  .alert.pos{background:var(--pos-soft);color:var(--pos);}
  .alert .dot{font-size:15px;line-height:1;}

  form.entry{display:flex;flex-direction:column;gap:10px;}
  .field-row{display:flex;gap:8px;}
  .field{flex:1;display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11.5px;color:var(--ink-soft);}
  .field input, .field select{
    padding:9px 10px;border:1px solid var(--border);border-radius:7px;
    font-size:14.5px;background:var(--bg);color:var(--ink);
  }
  .segmented{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
  .segmented button{
    flex:1;padding:9px;border:none;background:var(--bg);color:var(--ink-soft);font-size:13.5px;cursor:pointer;
  }
  .segmented button.on.entrada{background:var(--pos-soft);color:var(--pos);font-weight:600;}
  .segmented button.on.saida{background:var(--neg-soft);color:var(--neg);font-weight:600;}
  .btn-primary{
    padding:11px;border:none;border-radius:7px;background:var(--ink);color:#fff;
    font-size:14.5px;cursor:pointer;margin-top:2px;
  }
  .btn-secondary{
    padding:9px 12px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--ink);
    font-size:13px;cursor:pointer;
  }
  .btn-small{
    padding:7px 10px;border:none;border-radius:6px;font-size:12.5px;cursor:pointer;
  }
  .btn-small.pay{background:var(--pos);color:#fff;}
  .btn-small.undo{background:var(--bg);color:var(--ink-soft);border:1px solid var(--border);}

  ul.ledger{list-style:none;margin:0;padding:0;}
  ul.ledger li{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--border);
  }
  ul.ledger li:last-child{border-bottom:none;}
  .l-info{display:flex;flex-direction:column;}
  .l-cat{font-size:14px;}
  .l-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .l-amt{font-variant-numeric:tabular-nums;font-size:14.5px;}
  .l-amt.entrada{color:var(--pos);}
  .l-amt.saida{color:var(--neg);}
  .l-del{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;margin-left:8px;}

  .fixed-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
  .fixed-row:last-child{border-bottom:none;}
  .fixed-info{flex:1;}
  .fixed-name{font-size:14.5px;}
  .fixed-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .fixed-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .fixed-val{font-size:14.5px;font-variant-numeric:tabular-nums;}
  .badge{font-size:11px;padding:2px 7px;border-radius:20px;white-space:nowrap;}
  .badge.paid{background:var(--pos-soft);color:var(--pos);}
  .badge.pending{background:var(--warn-soft);color:#6B4D18;}
  .x-del{background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;line-height:1;padding:0 2px;}

  .invest-row{padding:12px 0;border-bottom:1px solid var(--border);}
  .invest-row:last-child{border-bottom:none;}
  .invest-top{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:3px;}
  .invest-meta{font-size:11.5px;color:var(--ink-soft);}
  .invest-yield{font-size:13px;color:var(--inv);margin-top:4px;}
  .invest-total{font-size:14px;font-weight:600;margin-top:2px;}

  .empty{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:24px 8px;}
  .goal-progress{height:10px;background:var(--pos-soft);border-radius:5px;overflow:hidden;margin:10px 0;}
  .goal-progress .fill{height:100%;background:var(--pos);}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Coach Financeiro</h1>
    <p>Inter + Itaú, tudo num lugar só</p>
  </header>

  <nav class="tabs">
    <button data-tab="dashboard" class="active">Painel</button>
    <button data-tab="lancamentos">Lançamentos</button>
    <button data-tab="fixos">Fixos</button>
    <button data-tab="investimentos">Investimentos</button>
    <button data-tab="metas">Meta</button>
  </nav>

  <main id="main"></main>
</div>

<script>
const STORAGE_KEY = 'coach-financeiro-dados';

let state = {
  transacoes: [],       // {id, tipo, valor, banco, descricao, data, origem, fixoId?}
  gastosFixos: [],       // {id, nome, valor, dia}
  pagamentosFixos: {},   // { "fixoId_YYYY-MM": transacaoId }
  salario: { valor: 0, dia: 5 },
  salarioCreditado: {},  // { "YYYY-MM": true }
  investimentos: [],     // {id, valor, data, taxaAnual, descricao}
  meta: 500,
};
let activeTab = 'dashboard';
let form = { tipo:'saida', valor:'', banco:'Inter', descricao:'' };
let fixoForm = { nome:'', valor:'', dia:'' };
let investForm = { valor:'', data:'', taxaAnual:'', descricao:'' };

const fmt = (n) => (n<0?'-':'') + 'R$ ' + Math.abs(n).toFixed(2).replace('.', ',');
const monthKey = (d) => d.slice(0,7);
const pad2 = (n) => String(n).padStart(2,'0');
const todayISO = () => {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
};
const nowMonthKey = () => todayISO().slice(0,7);

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
      state.gastosFixos = state.gastosFixos || [];
      state.pagamentosFixos = state.pagamentosFixos || {};
      state.salario = state.salario || { valor:0, dia:5 };
      state.salarioCreditado = state.salarioCreditado || {};
      state.investimentos = state.investimentos || [];
    }
  }catch(e){ console.error('Falha ao carregar dados salvos', e); }
  processarSalarioAutomatico();
  render();
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ console.error('Falha ao salvar', e); }
}

// Se o dia do salário já chegou/passou neste mês e ainda não foi lançado, credita automaticamente.
function processarSalarioAutomatico(){
  const mk = nowMonthKey();
  const hoje = new Date();
  if(state.salario.valor > 0 && hoje.getDate() >= state.salario.dia && !state.salarioCreditado[mk]){
    const diaLancamento = Math.min(state.salario.dia, new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate());
    const dataLanc = mk + '-' + pad2(diaLancamento);
    state.transacoes.push({
      id: Date.now(),
      tipo: 'entrada',
      valor: state.salario.valor,
      banco: 'Inter',
      descricao: 'Salário (automático)',
      data: dataLanc,
      origem: 'salario',
    });
    state.salarioCreditado[mk] = true;
    saveState();
  }
}

function currentMonthTx(offset=0){
  const now = new Date();
  now.setMonth(now.getMonth()-offset);
  const key = now.getFullYear() + '-' + pad2(now.getMonth()+1);
  return state.transacoes.filter(t => monthKey(t.data) === key);
}

function computeAlerts(){
  const alerts = [];
  const thisTx = currentMonthTx(0);
  const lastTx = currentMonthTx(1);
  const entradas = thisTx.filter(t=>t.tipo==='entrada').reduce((s,t)=>s+t.valor,0);
  const saidas = thisTx.filter(t=>t.tipo==='saida').reduce((s,t)=>s+t.valor,0);
  const saldo = entradas - saidas;
  const saidasLast = lastTx.filter(t=>t.tipo==='saida').reduce((s,t)=>s+t.valor,0);

  if(saldo < 0){
    alerts.push({tipo:'neg', texto:`Saldo do mês está negativo: ${fmt(saldo)}.`});
  }
  if(saidasLast > 0 && saidas > saidasLast * 1.15){
    const pct = Math.round((saidas/saidasLast - 1)*100);
    alerts.push({tipo:'warn', texto:`Seus gastos subiram ${pct}% em relação ao mês passado.`});
  }

  const mk = nowMonthKey();
  const hojeDia = new Date().getDate();
  state.gastosFixos.forEach(f=>{
    const pago = !!state.pagamentosFixos[`${f.id}_${mk}`];
    if(!pago && (f.dia - hojeDia) <= 3 && (f.dia - hojeDia) >= 0){
      alerts.push({tipo:'warn', texto:`${f.nome} vence dia ${f.dia} e ainda não foi marcado como pago.`});
    } else if(!pago && hojeDia > f.dia){
      alerts.push({tipo:'neg', texto:`${f.nome} venceu dia ${f.dia} e continua pendente.`});
    }
  });

  if(state.meta && saldo >= state.meta){
    alerts.push({tipo:'pos', texto:`Meta do mês batida! Você guardou ${fmt(saldo)}.`});
  }
  if(alerts.length===0){
    alerts.push({tipo:'pos', texto:'Nenhum alerta por enquanto — continue assim.'});
  }
  return {alerts, entradas, saidas, saldo};
}

function render(){
  const main = document.getElementById('main');
  if(activeTab==='dashboard') main.innerHTML = renderDashboard();
  else if(activeTab==='lancamentos') main.innerHTML = renderLancamentos();
  else if(activeTab==='fixos') main.innerHTML = renderFixos();
  else if(activeTab==='investimentos') main.innerHTML = renderInvestimentos();
  else if(activeTab==='metas') main.innerHTML = renderMetas();
  attachHandlers();
}

function renderDashboard(){
  const {alerts, entradas, saidas, saldo} = computeAlerts();
  const thisTx = currentMonthTx(0);
  const topGastos = [...thisTx].filter(t=>t.tipo==='saida').sort((a,b)=>b.valor-a.valor).slice(0,5);
  const mk = nowMonthKey();
  const fixosPagos = state.gastosFixos.filter(f=>state.pagamentosFixos[`${f.id}_${mk}`]).length;

  return `
    <div class="card">
      <div class="balance-label">Saldo do mês</div>
      <div class="balance-row">
        <div class="balance-num ${saldo<0?'neg':'pos'}">${fmt(saldo)}</div>
      </div>
      <div class="mini-row">
        <div class="mini"><div class="n" style="color:var(--pos)">${fmt(entradas)}</div><div class="l">Entradas</div></div>
        <div class="mini"><div class="n" style="color:var(--neg)">${fmt(saidas)}</div><div class="l">Saídas</div></div>
      </div>
    </div>

    <div class="section-title">Avisos do coach</div>
    <div>${alerts.map(a=>`<div class="alert ${a.tipo}"><span class="dot">${a.tipo==='pos'?'✓':a.tipo==='warn'?'!':'●'}</span><span>${a.texto}</span></div>`).join('')}</div>

    ${state.gastosFixos.length>0 ? `
    <div class="section-title">Fixos deste mês</div>
    <div class="card">
      <p style="font-size:13.5px;margin:0 0 4px;">${fixosPagos} de ${state.gastosFixos.length} gastos fixos já pagos.</p>
    </div>` : ''}

    <div class="section-title">Maiores gastos do mês</div>
    <div class="card">
      ${topGastos.length===0 ? '<p class="empty">Nenhum gasto lançado ainda.</p>' :
        `<ul class="ledger">${topGastos.map(t=>`<li>
          <div class="l-info">
            <span class="l-cat">${t.descricao || '(sem descrição)'}</span>
            <span class="l-meta">${t.data.split('-').reverse().join('/')} · ${t.banco}</span>
          </div>
          <span class="l-amt saida">-${fmt(t.valor)}</span>
        </li>`).join('')}</ul>`
      }
    </div>
  `;
}

function renderLancamentos(){
  const list = [...state.transacoes].sort((a,b)=> b.data.localeCompare(a.data) || b.id-a.id);
  return `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:12px;">Novo lançamento</h3>
      <form class="entry" id="entry-form">
        <div class="segmented">
          <button type="button" data-tipo="saida" class="${form.tipo==='saida'?'on saida':''}">Saída</button>
          <button type="button" data-tipo="entrada" class="${form.tipo==='entrada'?'on entrada':''}">Entrada</button>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Valor (R$)</label>
            <input type="number" step="0.01" min="0" id="f-valor" value="${form.valor}" placeholder="0,00">
          </div>
          <div class="field">
            <label>Banco</label>
            <select id="f-banco">
              <option ${form.banco==='Inter'?'selected':''}>Inter</option>
              <option ${form.banco==='Itaú'?'selected':''}>Itaú</option>
              <option ${form.banco==='Outro'?'selected':''}>Outro</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Descrição</label>
          <input type="text" id="f-desc" value="${form.descricao}" placeholder="ex: mercado, uber, freela">
        </div>
        <button type="submit" class="btn-primary">Adicionar</button>
      </form>
    </div>

    <div class="section-title">Histórico</div>
    <div class="card">
      ${list.length===0 ? '<p class="empty">Nenhum lançamento ainda. Adicione o primeiro acima.</p>' :
        `<ul class="ledger">${list.map(t=>{
          return `<li>
            <div class="l-info">
              <span class="l-cat">${t.descricao || '(sem descrição)'}</span>
              <span class="l-meta">${t.data.split('-').reverse().join('/')} · ${t.banco}${t.origem==='salario'?' · automático':''}${t.origem==='fixo'?' · fixo':''}</span>
            </div>
            <span class="l-amt ${t.tipo}">${t.tipo==='saida'?'-':'+'}${fmt(t.valor)}</span>
            <button class="l-del" data-del="${t.id}">remover</button>
          </li>`;
        }).join('')}</ul>`
      }
    </div>
  `;
}

function renderFixos(){
  const mk = nowMonthKey();
  return `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px;">Salário automático</h3>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;">No dia escolhido, o valor entra sozinho como entrada.</p>
      <div class="field-row">
        <div class="field">
          <label>Valor (R$)</label>
          <input type="number" step="0.01" min="0" id="f-salario-valor" value="${state.salario.valor||''}" placeholder="0,00">
        </div>
        <div class="field">
          <label>Dia do mês</label>
          <input type="number" min="1" max="31" id="f-salario-dia" value="${state.salario.dia||''}" placeholder="ex: 5">
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="font-size:15px;margin-bottom:12px;">Novo gasto fixo</h3>
      <form class="entry" id="fixo-form">
        <div class="field">
          <label>Nome</label>
          <input type="text" id="fx-nome" value="${fixoForm.nome}" placeholder="ex: aluguel, internet, academia">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Valor (R$)</label>
            <input type="number" step="0.01" min="0" id="fx-valor" value="${fixoForm.valor}" placeholder="0,00">
          </div>
          <div class="field">
            <label>Dia do vencimento</label>
            <input type="number" min="1" max="31" id="fx-dia" value="${fixoForm.dia}" placeholder="ex: 10">
          </div>
        </div>
        <button type="submit" class="btn-primary">Adicionar gasto fixo</button>
      </form>
    </div>

    <div class="section-title">Gastos fixos deste mês</div>
    <div class="card">
      ${state.gastosFixos.length===0 ? '<p class="empty">Nenhum gasto fixo cadastrado ainda.</p>' :
        state.gastosFixos.map(f=>{
          const pago = !!state.pagamentosFixos[`${f.id}_${mk}`];
          return `<div class="fixed-row">
            <div class="fixed-info">
              <div class="fixed-name">${f.nome}</div>
              <div class="fixed-meta">Vence dia ${f.dia} <span class="badge ${pago?'paid':'pending'}">${pago?'Pago':'Pendente'}</span></div>
            </div>
            <div class="fixed-actions">
              <div class="fixed-val">${fmt(f.valor)}</div>
              ${pago
                ? `<button class="btn-small undo" data-undo-fixo="${f.id}">desfazer</button>`
                : `<button class="btn-small pay" data-pay-fixo="${f.id}">marcar pago</button>`
              }
              <button class="x-del" data-del-fixo="${f.id}" title="excluir gasto fixo">✕</button>
            </div>
          </div>`;
        }).join('')
      }
    </div>
  `;
}

function diasEntre(dataISO){
  const d1 = new Date(dataISO + 'T00:00:00');
  const d2 = new Date(todayISO() + 'T00:00:00');
  return Math.max(0, Math.round((d2 - d1) / 86400000));
}

function renderInvestimentos(){
  const list = [...state.investimentos].sort((a,b)=> b.data.localeCompare(a.data));
  let totalInvestido = 0, totalRendimento = 0;
  const linhas = list.map(inv=>{
    const dias = diasEntre(inv.data);
    const rendimento = inv.valor * (Math.pow(1 + inv.taxaAnual/100, dias/365) - 1);
    const valorAtual = inv.valor + rendimento;
    totalInvestido += inv.valor;
    totalRendimento += rendimento;
    return `<div class="invest-row">
      <div class="invest-top"><span>${inv.descricao || 'CDB liquidez diária'}</span><span>${fmt(inv.valor)}</span></div>
      <div class="invest-meta">Aportado em ${inv.data.split('-').reverse().join('/')} · ${dias} dia(s) · ${inv.taxaAnual}% a.a.</div>
      <div class="invest-yield">Rendimento estimado: ${fmt(rendimento)}</div>
      <div class="invest-total">Saldo atual: ${fmt(valorAtual)}</div>
    </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="balance-label">Total investido</div>
      <div class="balance-row"><div class="balance-num pos">${fmt(totalInvestido + totalRendimento)}</div></div>
      <div class="mini-row">
        <div class="mini"><div class="n">${fmt(totalInvestido)}</div><div class="l">Aportado</div></div>
        <div class="mini"><div class="n" style="color:var(--inv)">${fmt(totalRendimento)}</div><div class="l">Rendimento</div></div>
      </div>
    </div>

    <div class="card">
      <h3 style="font-size:15px;margin-bottom:12px;">Novo aporte</h3>
      <form class="entry" id="invest-form">
        <div class="field-row">
          <div class="field">
            <label>Valor (R$)</label>
            <input type="number" step="0.01" min="0" id="iv-valor" value="${investForm.valor}" placeholder="0,00">
          </div>
          <div class="field">
            <label>Data do aporte</label>
            <input type="date" id="iv-data" value="${investForm.data || todayISO()}">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Taxa anual do CDB (%)</label>
            <input type="number" step="0.01" min="0" id="iv-taxa" value="${investForm.taxaAnual}" placeholder="ex: 12.5">
          </div>
          <div class="field">
            <label>Onde (opcional)</label>
            <input type="text" id="iv-desc" value="${investForm.descricao}" placeholder="ex: Inter, XP">
          </div>
        </div>
        <button type="submit" class="btn-primary">Adicionar aporte</button>
      </form>
      <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;">Cálculo estimado por juros compostos a partir da taxa anual informada, sem descontar IR. Ajuste a taxa se seu CDB variar em % do CDI.</p>
    </div>

    <div class="section-title">Seus aportes</div>
    <div class="card">
      ${list.length===0 ? '<p class="empty">Nenhum aporte lançado ainda.</p>' : linhas}
    </div>
  `;
}

function renderMetas(){
  const {saldo} = computeAlerts();
  const pct = state.meta>0 ? Math.min(100, Math.max(0, Math.round(saldo/state.meta*100))) : 0;
  return `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px;">Meta de economia mensal</h3>
      <div class="field" style="margin-top:10px;">
        <label>Valor da meta (R$)</label>
        <input type="number" min="0" step="50" id="f-meta" value="${state.meta}">
      </div>
      <div class="goal-progress"><div class="fill" style="width:${pct}%"></div></div>
      <p style="font-size:13px;color:var(--ink-soft);margin:0;">Progresso: ${fmt(saldo)} de ${fmt(state.meta)} (${pct}%)</p>
    </div>
  `;
}

function attachHandlers(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick = () => { activeTab = b.dataset.tab; document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); render(); };
  });

  // Lançamentos
  const ef = document.getElementById('entry-form');
  if(ef){
    document.querySelectorAll('.segmented button').forEach(b=>{
      b.onclick = () => { form.tipo = b.dataset.tipo; render(); };
    });
    ef.onsubmit = (e) => {
      e.preventDefault();
      const valor = parseFloat(document.getElementById('f-valor').value);
      if(!valor || valor<=0) return;
      const t = {
        id: Date.now(),
        tipo: form.tipo,
        valor,
        banco: document.getElementById('f-banco').value,
        descricao: document.getElementById('f-desc').value.trim(),
        data: todayISO(),
        origem: 'manual',
      };
      state.transacoes.push(t);
      form = { tipo:'saida', valor:'', banco:t.banco, descricao:'' };
      saveState();
      render();
    };
    document.querySelectorAll('.l-del').forEach(b=>{
      b.onclick = () => {
        const id = Number(b.dataset.del);
        state.transacoes = state.transacoes.filter(t=>t.id!==id);
        saveState();
        render();
      };
    });
  }

  // Fixos: salário
  const salValor = document.getElementById('f-salario-valor');
  const salDia = document.getElementById('f-salario-dia');
  if(salValor && salDia){
    const salvarSalario = () => {
      state.salario.valor = parseFloat(salValor.value) || 0;
      state.salario.dia = Math.min(31, Math.max(1, parseInt(salDia.value) || 1));
      saveState();
      processarSalarioAutomatico();
      render();
    };
    salValor.onchange = salvarSalario;
    salDia.onchange = salvarSalario;
  }

  // Fixos: novo gasto fixo
  const fxForm = document.getElementById('fixo-form');
  if(fxForm){
    fxForm.onsubmit = (e) => {
      e.preventDefault();
      const nome = document.getElementById('fx-nome').value.trim();
      const valor = parseFloat(document.getElementById('fx-valor').value);
      const dia = Math.min(31, Math.max(1, parseInt(document.getElementById('fx-dia').value) || 0));
      if(!nome || !valor || valor<=0 || !dia) return;
      state.gastosFixos.push({ id: Date.now(), nome, valor, dia });
      fixoForm = { nome:'', valor:'', dia:'' };
      saveState();
      render();
    };
  }
  document.querySelectorAll('[data-pay-fixo]').forEach(b=>{
    b.onclick = () => {
      const fixoId = Number(b.dataset.payFixo);
      const fixo = state.gastosFixos.find(f=>f.id===fixoId);
      if(!fixo) return;
      const mk = nowMonthKey();
      const t = {
        id: Date.now(),
        tipo: 'saida',
        valor: fixo.valor,
        banco: 'Inter',
        descricao: fixo.nome,
        data: todayISO(),
        origem: 'fixo',
        fixoId: fixo.id,
      };
      state.transacoes.push(t);
      state.pagamentosFixos[`${fixoId}_${mk}`] = t.id;
      saveState();
      render();
    };
  });
  document.querySelectorAll('[data-undo-fixo]').forEach(b=>{
    b.onclick = () => {
      const fixoId = Number(b.dataset.undoFixo);
      const mk = nowMonthKey();
      const key = `${fixoId}_${mk}`;
      const txId = state.pagamentosFixos[key];
      if(txId) state.transacoes = state.transacoes.filter(t=>t.id!==txId);
      delete state.pagamentosFixos[key];
      saveState();
      render();
    };
  });
  document.querySelectorAll('[data-del-fixo]').forEach(b=>{
    b.onclick = () => {
      const fixoId = Number(b.dataset.delFixo);
      state.gastosFixos = state.gastosFixos.filter(f=>f.id!==fixoId);
      Object.keys(state.pagamentosFixos).forEach(k=>{ if(k.startsWith(fixoId+'_')) delete state.pagamentosFixos[k]; });
      saveState();
      render();
    };
  });

  // Investimentos
  const ivForm = document.getElementById('invest-form');
  if(ivForm){
    ivForm.onsubmit = (e) => {
      e.preventDefault();
      const valor = parseFloat(document.getElementById('iv-valor').value);
      const data = document.getElementById('iv-data').value || todayISO();
      const taxaAnual = parseFloat(document.getElementById('iv-taxa').value);
      const descricao = document.getElementById('iv-desc').value.trim();
      if(!valor || valor<=0 || !taxaAnual || taxaAnual<0) return;
      state.investimentos.push({ id: Date.now(), valor, data, taxaAnual, descricao });
      investForm = { valor:'', data:'', taxaAnual:'', descricao:'' };
      saveState();
      render();
    };
  }

  // Meta
  const fm = document.getElementById('f-meta');
  if(fm){
    fm.onchange = () => {
      state.meta = parseFloat(fm.value) || 0;
      saveState();
      render();
    };
  }
}

loadState();
</script>
</body>
</html>
