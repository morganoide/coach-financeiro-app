<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Coach Financeiro</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="theme-color" content="#2F6B4F">

<style>
  :root{
    --bg:#F2F5EF;
    --surface:#FFFFFF;
    --ink:#1F2B24;
    --ink-soft:#5C6B60;
    --border:#DCE3D8;
    --pos:#2F6B4F;
    --pos-soft:#E4EFE8;
    --neg:#A6432F;
    --neg-soft:#F3E4DF;
    --warn:#B9822F;
    --warn-soft:#F5EBD8;
    --inv:#2F5D6B;
    --inv-soft:#E1EBEF;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3{
    font-family:Georgia,'Iowan Old Style',serif;
    font-weight:600;
    margin:0;
  }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
  }

  header.top{
    padding:calc(env(safe-area-inset-top) + 18px) 18px 14px;
    border-bottom:1px solid var(--border);
  }

  header.top h1{
    font-size:22px;
    letter-spacing:.2px;
  }

  header.top p{
    margin:4px 0 0;
    color:var(--ink-soft);
    font-size:13px;
  }

  nav.tabs{
    display:flex;
    overflow-x:auto;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    position:sticky;
    top:0;
    z-index:5;
  }

  nav.tabs button{
    flex:1 0 auto;
    padding:13px 14px;
    border:none;
    background:none;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }

  nav.tabs button.active{
    color:var(--ink);
    border-bottom-color:var(--pos);
    font-weight:600;
  }

  main{
    padding:16px 16px calc(env(safe-area-inset-bottom) + 40px);
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }

  .balance-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }

  .balance-num{
    font-family:Georgia,serif;
    font-size:30px;
    font-variant-numeric:tabular-nums;
  }

  .balance-num.neg{
    color:var(--neg);
  }

  .balance-num.pos{
    color:var(--pos);
  }

  .balance-label{
    font-size:12px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.5px;
  }

  .mini-row{
    display:flex;
    gap:10px;
  }

  .mini{
    flex:1;
    border-top:1px solid var(--border);
    padding-top:8px;
  }

  .mini .n{
    font-size:16px;
    font-variant-numeric:tabular-nums;
  }

  .mini .l{
    font-size:11.5px;
    color:var(--ink-soft);
  }

  .section-title{
    font-size:13px;
    color:var(--ink-soft);
    margin:18px 0 8px;
    text-transform:uppercase;
    letter-spacing:.5px;
  }

  .bar-row{
    margin-bottom:10px;
  }

  .bar-top{
    display:flex;
    justify-content:space-between;
    font-size:13.5px;
    margin-bottom:4px;
  }

  .bar-track{
    height:7px;
    background:var(--pos-soft);
    border-radius:4px;
    overflow:hidden;
  }

  .bar-fill{
    height:100%;
    background:var(--pos);
  }

  .bar-fill.over{
    background:var(--neg);
  }

  .alert{
    display:flex;
    gap:10px;
    padding:11px 12px;
    border-radius:8px;
    margin-bottom:8px;
    font-size:13.5px;
    line-height:1.4;
  }

  .alert.warn{
    background:var(--warn-soft);
    color:#6B4D18;
  }

  .alert.neg{
    background:var(--neg-soft);
    color:var(--neg);
  }

  .alert.pos{
    background:var(--pos-soft);
    color:var(--pos);
  }

  .alert .dot{
    font-size:15px;
    line-height:1;
  }

  form.entry{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .field-row{
    display:flex;
    gap:8px;
  }

  .field{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .field label{
    font-size:11.5px;
    color:var(--ink-soft);
  }

  .field input,
  .field select{
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:7px;
    font-size:14.5px;
    background:var(--bg);
    color:var(--ink);
  }

  .segmented{
    display:flex;
    border:1px solid var(--border);
    border-radius:7px;
    overflow:hidden;
  }

  .segmented button{
    flex:1;
    padding:9px;
    border:none;
    background:var(--bg);
    color:var(--ink-soft);
    font-size:13.5px;
    cursor:pointer;
  }

  .segmented button.on.entrada{
    background:var(--pos-soft);
    color:var(--pos);
    font-weight:600;
  }

  .segmented button.on.saida{
    background:var(--neg-soft);
    color:var(--neg);
    font-weight:600;
  }

  .btn-primary{
    padding:11px;
    border:none;
    border-radius:7px;
    background:var(--ink);
    color:#fff;
    font-size:14.5px;
    cursor:pointer;
    margin-top:2px;
  }

  .btn-secondary{
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--surface);
    color:var(--ink);
    font-size:13px;
    cursor:pointer;
  }

  .btn-small{
    padding:7px 10px;
    border:none;
    border-radius:6px;
    font-size:12.5px;
    cursor:pointer;
  }

  .btn-small.pay{
    background:var(--pos);
    color:#fff;
  }

  .btn-small.undo{
    background:var(--bg);
    color:var(--ink-soft);
    border:1px solid var(--border);
  }

  ul.ledger{
    list-style:none;
    margin:0;
    padding:0;
  }

  ul.ledger li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 0;
    border-bottom:1px solid var(--border);
  }

  ul.ledger li:last-child{
    border-bottom:none;
  }

  .l-info{
    display:flex;
    flex-direction:column;
  }

  .l-cat{
    font-size:14px;
  }

  .l-meta{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .l-amt{
    font-variant-numeric:tabular-nums;
    font-size:14.5px;
  }

  .l-amt.entrada{
    color:var(--pos);
  }

  .l-amt.saida{
    color:var(--neg);
  }

  .l-del{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:12px;
    cursor:pointer;
    margin-left:8px;
  }

  .fixed-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }

  .fixed-row:last-child{
    border-bottom:none;
  }

  .fixed-info{
    flex:1;
  }

  .fixed-name{
    font-size:14.5px;
  }

  .fixed-meta{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .fixed-actions{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }

  .fixed-val{
    font-size:14.5px;
    font-variant-numeric:tabular-nums;
  }

  .badge{
    font-size:11px;
    padding:2px 7px;
    border-radius:20px;
    white-space:nowrap;
  }

  .badge.paid{
    background:var(--pos-soft);
    color:var(--pos);
  }

  .badge.pending{
    background:var(--warn-soft);
    color:#6B4D18;
  }

  .x-del{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:16px;
    cursor:pointer;
    line-height:1;
    padding:0 2px;
  }

  .invest-row{
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }

  .invest-row:last-child{
    border-bottom:none;
  }

  .invest-top{
    display:flex;
    justify-content:space-between;
    font-size:14.5px;
    margin-bottom:3px;
  }

  .invest-meta{
    font-size:11.5px;
    color:var(--ink-soft);
  }

  .invest-yield{
    font-size:13px;
    color:var(--inv);
    margin-top:4px;
  }

  .invest-total{
    font-size:14px;
    font-weight:600;
    margin-top:2px;
  }

  .empty{
    color:var(--ink-soft);
    font-size:13.5px;
    text-align:center;
    padding:24px 8px;
  }

  .goal-progress{
    height:10px;
    background:var(--pos-soft);
    border-radius:5px;
    overflow:hidden;
    margin:10px 0;
  }

  .goal-progress .fill{
    height:100%;
    background:var(--pos);
  }

  .salary-box{
    border-top:1px solid var(--border);
    padding-top:12px;
    margin-top:12px;
  }

  .salary-box:first-of-type{
    border-top:none;
    padding-top:0;
    margin-top:0;
  }

  .salary-title{
    font-family:Georgia,serif;
    font-size:14px;
    margin-bottom:10px;
  }

  .salary-description{
    font-size:12px;
    color:var(--ink-soft);
    margin:8px 0 0;
    line-height:1.4;
  }
</style>
</head>

<body>

<div class="app">

  <header class="top">
    <h1>Coach Financeiro</h1>
    <p>Inter + Itaú, tudo num lugar só</p>
  </header>

  <nav class="tabs">
    <button data-tab="dashboard" class="active">Painel</button>
    <button data-tab="lancamentos">Lançamentos</button>
    <button data-tab="fixos">Fixos</button>
    <button data-tab="investimentos">Investimentos</button>
    <button data-tab="metas">Meta</button>
  </nav>

  <main id="main"></main>

</div>

<script>

const STORAGE_KEY = 'coach-financeiro-dados';

let state = {
  transacoes: [],

  gastosFixos: [],

  pagamentosFixos: {},

  // Salário 1: dia fixo
  salario1: {
    valor: 0,
    dia: 5
  },

  // Salário 2: 10º dia útil
  salario2: {
    valor: 0
  },

  // Guarda quais salários já foram lançados em cada mês
  salarioCreditado: {},

  investimentos: [],

  meta: 500
};

let activeTab = 'dashboard';

let form = {
  tipo:'saida',
  valor:'',
  banco:'Inter',
  descricao:''
};

let fixoForm = {
  nome:'',
  valor:'',
  dia:''
};

let investForm = {
  valor:'',
  data:'',
  taxaAnual:'',
  descricao:''
};


/* =========================================================
   FUNÇÕES BÁSICAS
========================================================= */

const fmt = (n) =>
  (n < 0 ? '-' : '') +
  'R$ ' +
  Math.abs(n).toFixed(2).replace('.', ',');

const monthKey = (d) => d.slice(0,7);

const pad2 = (n) =>
  String(n).padStart(2,'0');

const todayISO = () => {

  const d = new Date();

  return (
    d.getFullYear() +
    '-' +
    pad2(d.getMonth()+1) +
    '-' +
    pad2(d.getDate())
  );
};

const nowMonthKey = () =>
  todayISO().slice(0,7);


/* =========================================================
   10º DIA ÚTIL
========================================================= */

function calcular10DiaUtil(ano, mes){

  let data = new Date(ano, mes, 1);

  let diasUteis = 0;

  while(diasUteis < 10){

    const diaSemana = data.getDay();

    // Domingo = 0
    // Sábado = 6
    if(diaSemana !== 0 && diaSemana !== 6){
      diasUteis++;
    }

    if(diasUteis < 10){
      data.setDate(data.getDate() + 1);
    }
  }

  return data;
}


/* =========================================================
   CARREGAR DADOS
========================================================= */

function loadState(){

  try{

    const raw = localStorage.getItem(STORAGE_KEY);

    if(raw){

      const parsed = JSON.parse(raw);

      state = Object.assign(state, parsed);

      state.gastosFixos =
        state.gastosFixos || [];

      state.pagamentosFixos =
        state.pagamentosFixos || {};

      /*
        Compatibilidade com a versão antiga.

        Se existia apenas:
        state.salario

        transformamos para:
        state.salario1
      */

      if(
        parsed.salario &&
        !parsed.salario1
      ){

        state.salario1 = {
          valor: parsed.salario.valor || 0,
          dia: parsed.salario.dia || 5
        };
      }

      state.salario1 =
        state.salario1 || {
          valor:0,
          dia:5
        };

      state.salario2 =
        state.salario2 || {
          valor:0
        };

      state.salarioCreditado =
        state.salarioCreditado || {};

      state.investimentos =
        state.investimentos || [];

    }

  }catch(e){

    console.error(
      'Falha ao carregar dados salvos',
      e
    );

  }

  processarSalarioAutomatico();

  render();
}


/* =========================================================
   SALVAR
========================================================= */

function saveState(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(state)
    );

  }catch(e){

    console.error(
      'Falha ao salvar dados',
      e
    );

  }
}


/* =========================================================
   PROCESSAR SALÁRIOS AUTOMATICAMENTE
========================================================= */

function processarSalarioAutomatico(){

  const hoje = new Date();

  const ano = hoje.getFullYear();

  const mes = hoje.getMonth();

  const mk =
    ano +
    '-' +
    pad2(mes + 1);


  /* =====================================================
     SALÁRIO 1
     Dia fixo escolhido pelo usuário
  ===================================================== */

  if(
    state.salario1.valor > 0 &&
    hoje.getDate() >= state.salario1.dia &&
    !state.salarioCreditado[
      `${mk}_salario1`
    ]
  ){

    const ultimoDia =
      new Date(
        ano,
        mes + 1,
        0
      ).getDate();

    const diaLancamento =
      Math.min(
        state.salario1.dia,
        ultimoDia
      );

    const dataLanc =
      mk +
      '-' +
      pad2(diaLancamento);

    state.transacoes.push({

      id: Date.now(),

      tipo:'entrada',

      valor:
        state.salario1.valor,

      banco:'Inter',

      descricao:
        'Salário 1 (automático)',

      data:dataLanc,

      origem:'salario1'

    });

    state.salarioCreditado[
      `${mk}_salario1`
    ] = true;
  }


  /* =====================================================
     SALÁRIO 2
     10º dia útil
  ===================================================== */

  const decimoDiaUtil =
    calcular10DiaUtil(
      ano,
      mes
    );

  if(
    state.salario2.valor > 0 &&
    hoje >= decimoDiaUtil &&
    !state.salarioCreditado[
      `${mk}_salario2`
    ]
  ){

    const diaUtil =
      decimoDiaUtil.getDate();

    const dataLanc =
      ano +
      '-' +
      pad2(mes + 1) +
      '-' +
      pad2(diaUtil);

    state.transacoes.push({

      id: Date.now() + 1,

      tipo:'entrada',

      valor:
        state.salario2.valor,

      banco:'Inter',

      descricao:
        'Salário 2 (10º dia útil)',

      data:dataLanc,

      origem:'salario2'

    });

    state.salarioCreditado[
      `${mk}_salario2`
    ] = true;
  }


  saveState();
}


/* =========================================================
   TRANSAÇÕES DO MÊS
========================================================= */

function currentMonthTx(offset=0){

  const now = new Date();

  now.setMonth(
    now.getMonth() - offset
  );

  const key =
    now.getFullYear() +
    '-' +
    pad2(now.getMonth()+1);

  return state.transacoes.filter(
    t =>
      monthKey(t.data) === key
  );
}


/* =========================================================
   ALERTAS
========================================================= */

function computeAlerts(){

  const alerts = [];

  const thisTx =
    currentMonthTx(0);

  const lastTx =
    currentMonthTx(1);

  const entradas =
    thisTx
      .filter(t=>t.tipo==='entrada')
      .reduce(
        (s,t)=>s+t.valor,
        0
      );

  const saidas =
    thisTx
      .filter(t=>t.tipo==='saida')
      .reduce(
        (s,t)=>s+t.valor,
        0
      );

  const saldo =
    entradas - saidas;

  const saidasLast =
    lastTx
      .filter(t=>t.tipo==='saida')
      .reduce(
        (s,t)=>s+t.valor,
        0
      );


  if(saldo < 0){

    alerts.push({
      tipo:'neg',
      texto:
        `Saldo do mês está negativo: ${fmt(saldo)}.`
    });

  }


  if(
    saidasLast > 0 &&
    saidas > saidasLast * 1.15
  ){

    const pct =
      Math.round(
        (saidas / saidasLast - 1) * 100
      );

    alerts.push({
      tipo:'warn',
      texto:
        `Seus gastos subiram ${pct}% em relação ao mês passado.`
    });

  }


  const mk =
    nowMonthKey();

  const hojeDia =
    new Date().getDate();


  state.gastosFixos.forEach(f=>{

    const pago =
      !!state.pagamentosFixos[
        `${f.id}_${mk}`
      ];


    if(
      !pago &&
      (f.dia - hojeDia) <= 3 &&
      (f.dia - hojeDia) >= 0
    ){

      alerts.push({
        tipo:'warn',
        texto:
          `${f.nome} vence dia ${f.dia} e ainda não foi marcado como pago.`
      });

    }

    else if(
      !pago &&
      hojeDia > f.dia
    ){

      alerts.push({
        tipo:'neg',
        texto:
          `${f.nome} venceu dia ${f.dia} e continua pendente.`
      });

    }

  });


  if(
    state.meta &&
    saldo >= state.meta
  ){

    alerts.push({
      tipo:'pos',
      texto:
        `Meta do mês batida! Você guardou ${fmt(saldo)}.`
    });

  }


  if(alerts.length===0){

    alerts.push({
      tipo:'pos',
      texto:
        'Nenhum alerta por enquanto — continue assim.'
    });

  }


  return {
    alerts,
    entradas,
    saidas,
    saldo
  };
}


/* =========================================================
   RENDER PRINCIPAL
========================================================= */

function render(){

  const main =
    document.getElementById('main');

  if(
    activeTab === 'dashboard'
  ){

    main.innerHTML =
      renderDashboard();

  }

  else if(
    activeTab === 'lancamentos'
  ){

    main.innerHTML =
      renderLancamentos();

  }

  else if(
    activeTab === 'fixos'
  ){

    main.innerHTML =
      renderFixos();

  }

  else if(
    activeTab === 'investimentos'
  ){

    main.innerHTML =
      renderInvestimentos();

  }

  else if(
    activeTab === 'metas'
  ){

    main.innerHTML =
      renderMetas();

  }

  attachHandlers();
}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){

  const {
    alerts,
    entradas,
    saidas,
    saldo
  } = computeAlerts();


  const thisTx =
    currentMonthTx(0);


  const topGastos =
    [...thisTx]
      .filter(
        t=>t.tipo==='saida'
      )
      .sort(
        (a,b)=>b.valor-a.valor
      )
      .slice(0,5);


  const mk =
    nowMonthKey();


  const fixosPagos =
    state.gastosFixos.filter(
      f =>
        state.pagamentosFixos[
          `${f.id}_${mk}`
        ]
    ).length;


  return `

    <div class="card">

      <div class="balance-label">
        Saldo do mês
      </div>

      <div class="balance-row">

        <div class="balance-num ${
          saldo<0 ? 'neg' : 'pos'
        }">

          ${fmt(saldo)}

        </div>

      </div>


      <div class="mini-row">

        <div class="mini">

          <div
            class="n"
            style="color:var(--pos)"
          >
            ${fmt(entradas)}
          </div>

          <div class="l">
            Entradas
          </div>

        </div>


        <div class="mini">

          <div
            class="n"
            style="color:var(--neg)"
          >
            ${fmt(saidas)}
          </div>

          <div class="l">
            Saídas
          </div>

        </div>

      </div>

    </div>


    <div class="section-title">
      Avisos do coach
    </div>

    <div>

      ${alerts.map(
        a => `

        <div class="alert ${a.tipo}">

          <span class="dot">

            ${
              a.tipo==='pos'
              ? '✓'
              : a.tipo==='warn'
              ? '!'
              : '●'
            }

          </span>

          <span>
            ${a.texto}
          </span>

        </div>

      `
      ).join('')}

    </div>


    ${
      state.gastosFixos.length>0
      ?
      `

      <div class="section-title">
        Fixos deste mês
      </div>

/* =========================================================
   DIAS ENTRE DATAS
========================================================= */

function diasEntre(dataISO){

  const d1 =
    new Date(
      dataISO + 'T00:00:00'
    );

  const d2 =
    new Date(
      todayISO() + 'T00:00:00'
    );

  return Math.max(
    0,
    Math.round(
      (d2-d1)/86400000
    )
  );
}

/* =========================================================
   EVENTOS
========================================================= */

function attachHandlers(){

  /* =====================================================
     NAVEGAÇÃO
  ===================================================== */

  document
    .querySelectorAll('nav.tabs button')
    .forEach(b=>{

      b.onclick = () => {

        activeTab =
          b.dataset.tab;


        document
          .querySelectorAll(
            'nav.tabs button'
          )
          .forEach(x =>
            x.classList.remove(
              'active'
            )
          );


        b.classList.add('active');


        render();

      };

    });


  /* =====================================================
     LANÇAMENTOS
  ===================================================== */

  const ef =
    document.getElementById(
      'entry-form'
    );


  if(ef){

    document
      .querySelectorAll(
        '.segmented button'
      )
      .forEach(b=>{

        b.onclick = () => {

          form.tipo =
            b.dataset.tipo;

          render();

        };

      });


    ef.onsubmit = (e) => {

      e.preventDefault();


      const valor =
        parseFloat(
          document
            .getElementById(
              'f-valor'
            )
            .value
        );


      if(
        !valor ||
        valor <= 0
      ){

        return;

      }


      const t = {

        id:Date.now(),

        tipo:form.tipo,

        valor,

        banco:
          document
            .getElementById(
              'f-banco'
            )
            .value,

        descricao:
          document
            .getElementById(
              'f-desc'
            )
            .value
            .trim(),

        data:
          todayISO(),

        origem:'manual'

      };


      state.transacoes.push(t);


      form = {

        tipo:'saida',

        valor:'',

        banco:t.banco,

        descricao:''

      };


      saveState();

      render();

    };


    document
      .querySelectorAll('.l-del')
      .forEach(b=>{

        b.onclick = () => {

          const id =
            Number(
              b.dataset.del
            );


          state.transacoes =
            state.transacoes.filter(
              t => t.id !== id
            );


          saveState();

          render();

        };

      });

  }


  /* =====================================================
     SALÁRIOS
  ===================================================== */

  const sal1Valor =
    document.getElementById(
      'f-salario1-valor'
    );


  const sal1Dia =
    document.getElementById(
      'f-salario1-dia'
    );


  const sal2Valor =
    document.getElementById(
      'f-salario2-valor'
    );


  if(
    sal1Valor &&
    sal1Dia &&
    sal2Valor
  ){

    const salvarSalarios =
      () => {

        state.salario1.valor =
          parseFloat(
            sal1Valor.value
          ) || 0;


        state.salario1.dia =
          Math.min(
            31,
            Math.max(
              1,
              parseInt(
                sal1Dia.value
              ) || 1
            )
          );


        state.salario2.valor =
          parseFloat(
            sal2Valor.value
          ) || 0;


        saveState();


        processarSalarioAutomatico();


        render();

      };


    sal1Valor.onchange =
      salvarSalarios;


    sal1Dia.onchange =
      salvarSalarios;


    sal2Valor.onchange =
      salvarSalarios;

  }


  /* =====================================================
     NOVO GASTO FIXO
  ===================================================== */

  const fxForm =
    document.getElementById(
      'fixo-form'
    );


  if(fxForm){

    fxForm.onsubmit =
      (e) => {

        e.preventDefault();


        const nome =
          document
            .getElementById(
              'fx-nome'
            )
            .value
            .trim();


        const valor =
          parseFloat(
            document
              .getElementById(
                'fx-valor'
              )
              .value
          );


        const dia =
          Math.min(
            31,
            Math.max(
              1,
              parseInt(
                document
                  .getElementById(
                    'fx-dia'
                  )
                  .value
              ) || 0
            )
          );


        if(
          !nome ||
          !valor ||
          valor <= 0 ||
          !dia
        ){

          return;

        }


        state.gastosFixos.push({

          id:Date.now(),

          nome,

          valor,

          dia

        });


        fixoForm = {

          nome:'',

          valor:'',

          dia:''

        };


        saveState();

        render();

      };

  }


  /* =====================================================
     MARCAR FIXO COMO PAGO
  ===================================================== */

  document
    .querySelectorAll(
      '[data-pay-fixo]'
    )
    .forEach(b=>{

      b.onclick = () => {

        const fixoId =
          Number(
            b.dataset.payFixo
          );


        const fixo =
          state.gastosFixos.find(
            f =>
              f.id === fixoId
          );


        if(!fixo){

          return;

        }


        const mk =
          nowMonthKey();


        const t = {

          id:Date.now(),

          tipo:'saida',

          valor:fixo.valor,

          banco:'Inter',

          descricao:fixo.nome,

          data:todayISO(),

          origem:'fixo',

          fixoId:fixo.id

        };


        state.transacoes.push(t);


        state.pagamentosFixos[
          `${fixoId}_${mk}`
        ] = t.id;


        saveState();

        render();

      };

    });


  /* =====================================================
     DESFAZER PAGAMENTO FIXO
  ===================================================== */

  document
    .querySelectorAll(
      '[data-undo-fixo]'
    )
    .forEach(b=>{

      b.onclick = () => {

        const fixoId =
          Number(
            b.dataset.undoFixo
          );


        const mk =
          nowMonthKey();


        const key =
          `${fixoId}_${mk}`;


        const txId =
          state.pagamentosFixos[key];


        if(txId){

          state.transacoes =
            state.transacoes.filter(
              t =>
                t.id !== txId
            );

        }


        delete state.pagamentosFixos[
          key
        ];


        saveState();

        render();

      };

    });


  /* =====================================================
     EXCLUIR FIXO
  ===================================================== */

  document
    .querySelectorAll(
      '[data-del-fixo]'
    )
    .forEach(b=>{

      b.onclick = () => {

        const fixoId =
          Number(
            b.dataset.delFixo
          );


        state.gastosFixos =
          state.gastosFixos.filter(
            f =>
              f.id !== fixoId
          );


        Object
          .keys(
            state.pagamentosFixos
          )
          .forEach(k=>{

            if(
              k.startsWith(
                fixoId + '_'
              )
            ){

              delete state.pagamentosFixos[k];

            }

          });


        saveState();

        render();

      };

    });


  /* =====================================================
     INVESTIMENTOS
  ===================================================== */

  const ivForm =
    document.getElementById(
      'invest-form'
    );


  if(ivForm){

    ivForm.onsubmit =
      (e) => {

        e.preventDefault();


        const valor =
          parseFloat(
            document
              .getElementById(
                'iv-valor'
              )
              .value
          );


        const data =
          document
            .getElementById(
              'iv-data'
            )
            .value ||
          todayISO();


        const taxaAnual =
          parseFloat(
            document
              .getElementById(
                'iv-taxa'
              )
              .value
          );


        const descricao =
          document
            .getElementById(
              'iv-desc'
            )
            .value
            .trim();


        if(
          !valor ||
          valor <= 0 ||
          !taxaAnual ||
          taxaAnual < 0
        ){

          return;

        }


        state.investimentos.push({

          id:Date.now(),

          valor,

          data,

          taxaAnual,

          descricao

        });


        investForm = {

          valor:'',

          data:'',

          taxaAnual:'',

          descricao:''

        };


        saveState();

        render();

      };

  }


  /* =====================================================
     META
  ===================================================== */

  const fm =
    document.getElementById(
      'f-meta'
    );


  if(fm){

    fm.onchange = () => {

      state.meta =
        parseFloat(
          fm.value
        ) || 0;


      saveState();

      render();

    };

  }

}


/* =========================================================
   INICIAR APP
========================================================= */

loadState();

</script>

</body>
</html>
